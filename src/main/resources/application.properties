spring.application.name=ecommerce-backend

# --- Database Configuration ---
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:railway}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}

# --- Hibernate & JPA Settings ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Jackson Serialization Settings ---
spring.jackson.serialization.indent-output=true

# --- Google OAuth2 Configuration ---
google.client.id=${GOOGLE_CLIENT_ID}
google.client.secret=${GOOGLE_CLIENT_SECRET}

# --- Mail API Configuration ---
brevo.api.key=${BREVO_API_KEY}
spring.mail.username=${SPRING_MAIL_USERNAME}

# --- Server Configuration ---
server.address=0.0.0.0

# --- VNPAY Configuration ---
vnpay.tmnCode=LEDMG40Y
vnpay.hashSecret=2MCQXCBWL51L1EQSR0AIFAFPXB97Z9YM
vnpay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.returnUrl=${VNPAY_RETURN_URL:http://localhost:8080/vnpay-return}