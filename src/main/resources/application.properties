spring.application.name=ecommerce-backend

# --- Database Configuration ---
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:ecommerce_app}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}

# --- Hibernate & JPA Settings ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Jackson Serialization Settings ---
spring.jackson.serialization.indent-output=true

# --- Google OAuth2 & Gmail Configuration ---
google.client.id=${GOOGLE_CLIENT_ID:dummy_id}
google.client.secret=${GOOGLE_CLIENT_SECRET:dummy_secret}
google.gmail.refresh-token=${GMAIL_REFRESH_TOKEN:dummy_token}

# --- Server Configuration ---
server.address=0.0.0.0
server.port=${PORT:8081}

# --- VNPAY Configuration ---
vnpay.tmnCode=LEDMG40Y
vnpay.hashSecret=${VNPAY_HASH_SECRET}
vnpay.url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.returnUrl=${VNPAY_RETURN_URL:http://localhost:8080/vnpay-return}

# --- Gemini AI Configuration (Test)---
gemini.api.key=${GEMINI_API_KEY}
gemini.api.url=https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash:generateContent

# --- Cloudinary Configuration ---
cloudinary.cloud-name=${CLOUDINARY_CLOUD_NAME:dummy_cloud_name}
cloudinary.api-key=${CLOUDINARY_API_KEY:dummy_api_key}
cloudinary.api-secret=${CLOUDINARY_API_SECRET:dummy_api_secret}