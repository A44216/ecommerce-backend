spring.application.name=ecommerce-backend

# --- Database Configuration ---
# Railway's MySQL service usually defaults to a database named 'railway'
spring.datasource.url=jdbc:mysql://${MYSQLHOST:localhost}:${MYSQLPORT:3306}/${MYSQLDATABASE:railway}
spring.datasource.username=${MYSQLUSER:root}
spring.datasource.password=${MYSQLPASSWORD:}

# --- Hibernate Settings ---
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
spring.jpa.open-in-view=false

# --- Google & Jackson Settings ---
spring.jackson.serialization.indent-output=true
google.client.id=${GOOGLE_CLIENT_ID:788868703007-1vlhvrncgq58hgca8ohtrd4fuulnblfq.apps.googleusercontent.com}
google.client.secret=${GOOGLE_CLIENT_SECRET}

# --- Mail Configuration (Strictly Port 465 / SMTPS) ---
spring.mail.host=${SPRING_MAIL_HOST:smtp.gmail.com}
spring.mail.port=${SPRING_MAIL_PORT:465}
spring.mail.username=${SPRING_MAIL_USERNAME}
spring.mail.password=${SPRING_MAIL_PASSWORD}
spring.mail.protocol=smtps

# SMTPS Properties for Implicit SSL
spring.mail.properties.mail.smtps.auth=true
spring.mail.properties.mail.smtps.ssl.enable=true
spring.mail.properties.mail.smtps.ssl.trust=smtp.gmail.com
spring.mail.properties.mail.smtps.starttls.enable=false

# Socket Factory (Crucial for Port 465 on Railway)
spring.mail.properties.mail.smtps.localaddress=0.0.0.0
spring.mail.properties.mail.smtps.socketFactory.port=465
spring.mail.properties.mail.smtps.socketFactory.class=javax.net.ssl.SSLSocketFactory
spring.mail.properties.mail.smtps.socketFactory.fallback=false

# Mail Timeout & Debugging (Synchronized to smtps)
spring.mail.properties.mail.smtps.timeout=10000
spring.mail.properties.mail.smtps.connectiontimeout=10000
spring.mail.properties.mail.debug=true

# --- Server Configuration ---
server.port=${PORT:8080}
server.address=0.0.0.0

